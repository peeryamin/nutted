<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>BugSeek AI — master logo</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233D"/>
      <stop offset="0.55" stop-color="#0E1526"/>
      <stop offset="1" stop-color="#0A0F1E"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- inner hairline -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none"
        stroke="#34D399" stroke-opacity="0.18" stroke-width="3"/>

  <!-- magnifier ring -->
  <circle cx="250" cy="240" r="124" fill="none" stroke="url(#mint)" stroke-width="48"/>
  <!-- highlight arc -->
  <path d="M 162 240 A 124 124 0 0 1 250 116" fill="none" stroke="#FFFFFF"
        stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>

  <!-- magnifier handle -->
  <line x1="328" y1="318" x2="418" y2="408" stroke="url(#mint)"
        stroke-width="54" stroke-linecap="round"/>

  <!-- bug glyph (breaks the lens boundary on purpose: the bug escapes the glass) -->
  <g stroke-linecap="round">
    <!-- antennae -->
    <line x1="242" y1="164" x2="220" y2="136" stroke="#EAF6F0" stroke-width="11"/>
    <line x1="258" y1="164" x2="280" y2="136" stroke="#EAF6F0" stroke-width="11"/>
    <!-- legs -->
    <g stroke="#EAF6F0" stroke-width="15">
      <line x1="232" y1="216" x2="198" y2="200"/>
      <line x1="232" y1="242" x2="194" y2="242"/>
      <line x1="232" y1="268" x2="198" y2="284"/>
      <line x1="268" y1="216" x2="302" y2="200"/>
      <line x1="268" y1="242" x2="306" y2="242"/>
      <line x1="268" y1="268" x2="302" y2="284"/>
    </g>
    <!-- head -->
    <circle cx="250" cy="180" r="21" fill="#EAF6F0"/>
    <!-- body -->
    <rect x="232" y="198" width="36" height="88" rx="18" fill="#EAF6F0"/>
    <!-- body split line -->
    <line x1="250" y1="202" x2="250" y2="282" stroke="#0E1526" stroke-width="10"/>
  </g>
</svg>
